name: Validate skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate package
        run: python -X utf8 tests/verify_package.py
      - name: Run unit tests
        run: python -X utf8 -m unittest discover -s tests -p "test_*.py" -v
      - name: Check publication safety
        run: python -X utf8 tests/verify_publication.py
      - name: Preview installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -DryRun -SkillHome (Join-Path $env:RUNNER_TEMP 'orchestrator-skills')
